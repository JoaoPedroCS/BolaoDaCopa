<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bolão da Copa 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --pitch:#0a0f0d; --panel:#111a16; --panel-2:#0e1512; --line:#23302a;
    --chalk:#eef3ef; --muted:#86988e; --signal:#d7ff3e; --live:#ff5d3b;
    --p5:#d7ff3e; --p3:#46e0c8; --p25:#ffb13b; --p0:#3a4842; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:radial-gradient(1200px 600px at 50% -10%,#16241d 0%,transparent 60%),var(--pitch);
    color:var(--chalk);font-family:'Inter',system-ui,sans-serif;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:18px 16px 90px}
  .mono{font-family:'Space Mono',monospace}
  a{color:var(--signal)}

  header{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);padding:18px 18px 16px;position:relative;overflow:hidden}
  header::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px);pointer-events:none}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px var(--signal)}
  h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(40px,11vw,76px);line-height:.92;letter-spacing:.01em;margin-top:6px}
  h1 .pop{color:var(--signal)}
  .sub{color:var(--muted);font-size:13px;margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sync{font-family:'Space Mono',monospace;font-size:11px}

  .identbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);position:relative}
  .identbar .who-am{display:flex;align-items:center;gap:9px;font-size:13px;min-width:0}
  .identbar .who-am .lbl{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .identbar .who-am .nm{font-weight:700}

  nav.tabs{display:flex;gap:6px;margin:16px 0 14px;flex-wrap:wrap}
  .tab{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.15s}
  .tab:hover{color:var(--chalk);border-color:#33433b}
  .tab[aria-selected="true"]{background:var(--signal);color:#0a0f0d;border-color:var(--signal);font-weight:700}

  .btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--chalk);font-family:'Inter',sans-serif;font-weight:600;font-size:13px;padding:9px 13px;border-radius:10px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:#3a4d44}
  .btn.primary{background:var(--signal);color:#0a0f0d;border-color:var(--signal)}
  .btn.ghost{background:transparent}
  .btn.small{font-size:11px;padding:6px 11px;font-family:'Space Mono',monospace;letter-spacing:.05em}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 13px;font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;transition:.15s}
  .chip:hover{color:var(--chalk)}
  .chip[aria-pressed="true"]{background:#1d2a24;color:var(--chalk);border-color:#34453d}

  /* avatars */
  .av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#1c2823;border:1px solid var(--line);flex:none}
  .av.ph{display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted)}

  /* leaderboard */
  .board{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
  .board .row{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
  .board .row:first-child{border-top:none}
  .board .row.head{background:var(--panel-2);color:var(--muted);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
  .rank{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;color:var(--muted);text-align:center}
  .row.r1 .rank{color:var(--signal)} .row.r2 .rank{color:#cfe6c2} .row.r3 .rank{color:#ffb13b}
  .who{display:flex;align-items:center;gap:11px;min-width:0}
  .who .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .meta{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace}
  .pts{font-family:'Space Mono',monospace;font-weight:700;font-size:24px;text-align:right;color:var(--signal);white-space:nowrap}
  .pts small{display:block;font-size:9px;font-weight:400;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .row.me{background:linear-gradient(90deg,rgba(215,255,62,.10),transparent);box-shadow:inset 3px 0 0 var(--signal)}
  .youtag{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;background:var(--signal);color:#0a0f0d;border-radius:5px;padding:1px 5px;margin-left:6px;text-transform:uppercase;vertical-align:middle}

  /* match card */
  .match{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:12px;overflow:hidden;cursor:pointer;transition:.15s}
  .match:hover{border-color:#3a4d44;transform:translateY(-1px)}
  .match .top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .match .top .g{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .status{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .status.live{color:var(--live);border-color:#4a2a25;background:#1c100d}
  .status.fin{color:var(--signal);border-color:#33431b;background:#161c0c}
  .scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:16px 14px}
  .team{display:flex;align-items:center;gap:9px;min-width:0}
  .team.away{justify-content:flex-end;text-align:right}
  .team img{width:30px;height:22px;object-fit:cover;border-radius:3px;background:#1c2823;flex:none}
  .team .tn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bignum{font-family:'Space Mono',monospace;font-weight:700;font-size:30px;min-width:34px;text-align:center}
  .vs{font-family:'Space Mono',monospace;color:var(--muted);font-size:14px}
  .kickoff{text-align:center;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);padding:0 14px 8px}
  .cardfoot{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)}
  .cardfoot .go{color:var(--signal)}
  .roundhead{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;color:var(--chalk);margin:18px 0 10px;display:flex;align-items:center;gap:10px}
  .roundhead::after{content:"";flex:1;height:1px;background:var(--line)}

  /* pick line (used in detail modals) */
  .pick-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .pick-line:first-of-type{border-top:none}
  .pick-line.me{box-shadow:inset 3px 0 0 var(--signal);padding-left:9px;border-radius:4px;background:linear-gradient(90deg,rgba(215,255,62,.08),transparent)}
  .pl-who{display:flex;align-items:center;gap:9px;min-width:0}
  .pl-who .av{width:28px;height:28px}
  .pl-who .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-rank{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);width:20px;text-align:center;flex:none}
  .pl-right{display:flex;align-items:center;gap:9px;flex:none}
  .pscore{font-family:'Space Mono',monospace;font-size:15px;color:var(--chalk)}
  .pscore.none{color:var(--muted)}
  .ptag{font-family:'Space Mono',monospace;font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;min-width:40px;text-align:center;color:#0a0f0d}
  .ptag.p5{background:var(--p5)} .ptag.p3{background:var(--p3)} .ptag.p25{background:var(--p25)} .ptag.p0{background:var(--p0);color:var(--muted)}
  .ptag.pending{background:transparent;color:var(--muted);border:1px dashed var(--line)}

  /* profile grid */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .pcard{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
  .pcard:hover{border-color:#3a4d44;transform:translateY(-1px)}
  .pcard.me{box-shadow:inset 0 0 0 1px var(--signal)}
  .pcard .av{width:48px;height:48px}
  .pcard .nm{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1}
  .pcard .tt{font-family:'Space Mono',monospace;font-size:12px;color:var(--signal);margin-top:2px}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(4,7,6,.74);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:22px 12px;overflow:auto;z-index:50}
  .scrim.open{display:flex}
  .modal{width:100%;max-width:540px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:16px;position:relative}
  .modal .x{position:absolute;top:12px;right:12px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px}
  .modal .x:hover{color:var(--chalk)}
  .modal h3{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.02em;padding-right:36px}
  .modal .mhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .modal .mhead .av{width:50px;height:50px}
  .modal-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 0 16px;border-bottom:1px solid var(--line);margin-bottom:8px}

  /* entry modal */
  .entry-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
  .entry-prof{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel-2);border-radius:11px;padding:10px;cursor:pointer;transition:.15s;text-align:left}
  .entry-prof:hover{border-color:var(--signal);background:#15201b}
  .entry-prof .av{width:36px;height:36px}
  .entry-prof .nm{font-weight:600;font-size:14px}
  .entry-guest{width:100%;margin-top:4px}

  /* pick editor */
  .pe-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .pe-row .lbl{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pe-row .lbl.away{text-align:right}
  .pe-row .mid{display:flex;gap:6px;align-items:center;justify-content:center}
  .fld{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--chalk);font-family:'Inter',sans-serif;font-size:14px;padding:9px 11px}
  .fld:focus{outline:none;border-color:var(--signal)}
  .scoreinput{width:46px;text-align:center;font-family:'Space Mono',monospace;font-weight:700;font-size:16px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .locked-note{font-size:12px;color:var(--muted);font-family:'Space Mono',monospace}

  .empty{border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted)}
  footer{margin-top:26px;color:var(--muted);font-size:12px;text-align:center;font-family:'Space Mono',monospace;line-height:1.9}
  .hidden{display:none!important}
  @media (max-width:520px){.pts{font-size:20px}.board .row{grid-template-columns:38px 1fr auto;gap:9px;padding:11px}.entry-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><span class="dot"></span> Fase de grupos · Copa 2026 · USA · CAN · MEX</div>
    <h1>Bolão <span class="pop">da Copa</span></h1>
    <div class="sub"><span class="sync mono" id="syncInfo">carregando…</span></div>
    <div class="identbar">
      <div class="who-am" id="whoAm"><span class="lbl">Você</span></div>
      <button class="btn small ghost" id="switchBtn">Trocar</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="content"><div class="empty">Carregando dados…</div></main>

  <footer>
    Pontuação: <b style="color:var(--p5)">5</b> placar exato ·
    <b style="color:var(--p3)">3</b> empate certo ·
    <b style="color:var(--p25)">2,5</b> vencedor certo ·
    <b style="color:var(--muted)">0</b> errou
  </footer>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================
   CONFIGURAÇÃO  (mesma ideia de antes: arquivo local OU JsonBin)
   ============================================================ */
const CONFIG = {
  jsonbin: { enabled:false, binId:"", accessKey:"" }
};

/* ---------- Estado ---------- */
let MATCHES=[], PROFILES=[];
let VIEW="ranking";
let RANK_ROUND="ALL";       // 'ALL' | 1 | 2 | 3
let GROUP_FILTER="ALL";
let IDENTITY=localStorage.getItem("bolao_identity")||null;  // profileId | 'guest' | null
let DIRTY=false, ENTRY_LOCK=false;

const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============================================================ PONTUAÇÃO 5/3/2,5/0 */
function scorePick(pick,m){
  if(m.status!=="FINISHED"||m.homeScore==null||m.awayScore==null) return null;
  if(!pick||pick.home==null||pick.away==null) return 0;
  const ph=+pick.home,pa=+pick.away,ah=+m.homeScore,aa=+m.awayScore;
  if(ph===ah&&pa===aa) return 5;
  const ps=Math.sign(ph-pa),as=Math.sign(ah-aa);
  if(ps!==as) return 0;
  if(as===0) return 3;
  return 2.5;
}
const tagClass=(p)=>p===5?"p5":p===3?"p3":p===2.5?"p25":"p0";
const fmtPts=(n)=>Number.isInteger(n)?String(n):String(n).replace(".",",");

function statsFor(prof,roundFilter="ALL"){
  let total=0,c5=0,c3=0,c25=0,c0=0,played=0;
  for(const m of MATCHES){
    if(roundFilter!=="ALL" && m.round!==roundFilter) continue;
    const p=scorePick(prof.picks?.[m.id],m);
    if(p===null) continue;
    played++; total+=p;
    if(p===5)c5++; else if(p===3)c3++; else if(p===2.5)c25++; else c0++;
  }
  return {total,c5,c3,c25,c0,played};
}
function ranking(roundFilter){
  return PROFILES.map(p=>({prof:p,...statsFor(p,roundFilter)}))
    .sort((a,b)=> b.total-a.total || b.c5-a.c5 || b.c3-a.c3 || a.prof.name.localeCompare(b.prof.name,"pt"));
}

/* ============================================================ IDENTIDADE */
const profileById=(id)=>PROFILES.find(p=>p.id===id);
const me=()=>IDENTITY&&IDENTITY!=="guest"?profileById(IDENTITY):null;
function setIdentity(id){ IDENTITY=id; localStorage.setItem("bolao_identity",id); renderIdentBar(); buildTabs(); render(); }

function renderIdentBar(){
  const m=me();
  $("#whoAm").innerHTML = m
    ? `<span class="lbl">Você é</span> ${avatar(m,"")} <span class="nm">${esc(m.name)}</span>`
    : `<span class="lbl">Você é</span> <span class="nm">Visitante</span>`;
}

function openEntry(force){
  ENTRY_LOCK = !IDENTITY || !!force ? true : false;
  const profs = PROFILES.map(p=>`<button class="entry-prof" data-id="${esc(p.id)}">${avatar(p,"")}<span class="nm">${esc(p.name)}</span></button>`).join("");
  $("#modal").innerHTML = `
    ${IDENTITY?'<button class="x" id="m-x">×</button>':''}
    <h3>Quem é você?</h3>
    <p class="locked-note" style="margin-top:4px">Escolha seu perfil pra ver seus palpites e seu destaque no ranking — ou entre como visitante.</p>
    <div class="entry-grid">${profs}</div>
    <button class="btn ghost entry-guest" id="m-guest">Entrar como visitante</button>`;
  openModal();
  $$(".entry-prof").forEach(b=>b.onclick=()=>{ setIdentity(b.dataset.id); closeModal(true); });
  if($("#m-guest")) $("#m-guest").onclick=()=>{ setIdentity("guest"); closeModal(true); };
  if($("#m-x")) $("#m-x").onclick=()=>closeModal(true);
}

/* ============================================================ DADOS */
async function loadMatches(){
  const r=await fetch(`matches.json?t=${Date.now()}`); if(!r.ok) throw new Error("matches.json");
  const d=await r.json();
  MATCHES=(d.matches||[]).map(m=>({round:1,...m})).sort((a,b)=> new Date(a.utcDate)-new Date(b.utcDate));
  const when=d.updatedAt?new Date(d.updatedAt):null;
  const live=MATCHES.some(m=>m.status==="IN_PLAY");
  $("#syncInfo").innerHTML=(live?'<span style="color:var(--live)">● AO VIVO</span> · ':'')+
    "placares: "+(when?when.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—");
}
async function loadPredictions(){
  if(CONFIG.jsonbin.enabled&&CONFIG.jsonbin.binId){
    const h={}; if(CONFIG.jsonbin.accessKey) h["X-Access-Key"]=CONFIG.jsonbin.accessKey;
    const r=await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.jsonbin.binId}/latest`,{headers:h});
    if(!r.ok) throw new Error("JsonBin "+r.status);
    PROFILES=((await r.json()).record?.profiles)||[];
  }else{
    const r=await fetch(`predictions.json?t=${Date.now()}`); if(!r.ok) throw new Error("predictions.json");
    PROFILES=((await r.json()).profiles)||[];
  }
}
async function loadAll(){
  try{
    await Promise.all([loadMatches(),loadPredictions()]);
    renderIdentBar(); buildTabs();
    if(!IDENTITY) openEntry(true); else render();
  }catch(e){
    $("#content").innerHTML=`<div class="empty">Não consegui carregar os dados (${esc(e.message)}).</div>`;
  }
}

/* ============================================================ SALVAR (só os palpites do próprio usuário) */
async function save(){
  const payload={updatedAt:new Date().toISOString(),profiles:PROFILES};
  if(CONFIG.jsonbin.enabled&&CONFIG.jsonbin.binId){
    let key=sessionStorage.getItem("jb_write_key");
    if(!key){ key=prompt("Chave de ESCRITA do JsonBin (fica só nesta aba)."); if(!key) return; sessionStorage.setItem("jb_write_key",key.trim()); }
    const r=await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.jsonbin.binId}`,{method:"PUT",
      headers:{"Content-Type":"application/json","X-Master-Key":key.trim(),"X-Bin-Versioning":"false"},body:JSON.stringify(payload)});
    if(!r.ok){ sessionStorage.removeItem("jb_write_key"); alert("Falha ao salvar no JsonBin ("+r.status+")."); return; }
    DIRTY=false; flash("Salvo no JsonBin ✓");
  }else{
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="predictions.json"; a.click(); URL.revokeObjectURL(a.href);
    DIRTY=false; flash("Baixado: dê commit em data/predictions.json");
  }
}
function flash(msg){
  const f=document.createElement("div"); f.textContent=msg;
  f.style.cssText="position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--signal);color:#0a0f0d;font-weight:700;font-size:13px;padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.4)";
  document.body.appendChild(f); setTimeout(()=>f.remove(),2800);
}

/* ============================================================ HELPERS DE RENDER */
function avatar(prof,cls=""){
  if(prof.photo) return `<img class="av ${cls}" src="${esc(prof.photo)}" alt="" onerror="this.outerHTML='<div class=\\'av ph ${cls}\\'>${esc((prof.name||'?')[0])}</div>'">`;
  return `<div class="av ph ${cls}">${esc((prof.name||"?")[0])}</div>`;
}
const statusBadge=(m)=> m.status==="FINISHED"?`<span class="status fin">Encerrado</span>`
  : m.status==="IN_PLAY"?`<span class="status live">● Ao vivo</span>` : `<span class="status">A jogar</span>`;
const kickoff=(m)=> new Date(m.utcDate).toLocaleString("pt-BR",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const roundsAvailable=()=>[...new Set(MATCHES.map(m=>m.round))].sort((a,b)=>a-b);
const groupsAvailable=()=>[...new Set(MATCHES.map(m=>m.group))].sort();

/* ============================================================ TABS */
function buildTabs(){
  const base=[["ranking","Ranking"],["jogos","Jogos"],["perfis","Palpiteiros"]];
  if(me()) base.push(["meus","Meus palpites"]);
  if(!base.find(t=>t[0]===VIEW)) VIEW="ranking";
  $("#tabs").innerHTML=base.map(([v,l])=>`<button class="tab" role="tab" data-view="${v}" aria-selected="${VIEW===v}">${l}</button>`).join("");
  $$(".tab").forEach(t=>t.onclick=()=>{ VIEW=t.dataset.view; buildTabs(); render(); });
}

/* ============================================================ RENDER DISPATCH */
function render(){
  if(VIEW==="ranking") renderRanking();
  else if(VIEW==="jogos") renderJogos();
  else if(VIEW==="perfis") renderPerfis();
  else if(VIEW==="meus") renderMeus();
}

/* ---- Ranking ---- */
function renderRanking(){
  if(!PROFILES.length){ $("#content").innerHTML=`<div class="empty">Nenhum palpiteiro cadastrado.</div>`; return; }
  const rounds=roundsAvailable();
  const chips=[`<button class="chip" data-r="ALL" aria-pressed="${RANK_ROUND==='ALL'}">Total da fase</button>`]
    .concat(rounds.map(r=>`<button class="chip" data-r="${r}" aria-pressed="${RANK_ROUND===r}">Rodada ${r}</button>`)).join("");
  const rk=ranking(RANK_ROUND);
  const rows=rk.map((e,i)=>{
    const cls=(i===0?"r1":i===1?"r2":i===2?"r3":"")+(me()&&me().id===e.prof.id?" me":"");
    const tag=me()&&me().id===e.prof.id?`<span class="youtag">você</span>`:"";
    return `<div class="row ${cls}">
      <div class="rank">${i+1}</div>
      <div class="who">${avatar(e.prof)}<div style="min-width:0"><div class="nm">${esc(e.prof.name)}${tag}</div>
        <div class="meta">${e.c5}×5 · ${e.c3}×3 · ${e.c25}×2,5 · ${e.played} jogos</div></div></div>
      <div class="pts">${fmtPts(e.total)}<small>pontos</small></div>
    </div>`;
  }).join("");
  $("#content").innerHTML=`<div class="filters">${chips}</div>
    <div class="board"><div class="row head"><div>#</div><div>Palpiteiro</div><div style="text-align:right">Pontos</div></div>${rows}</div>`;
  $$(".chip").forEach(c=>c.onclick=()=>{ RANK_ROUND=c.dataset.r==="ALL"?"ALL":+c.dataset.r; renderRanking(); });
}

/* ---- Jogos (agrupado por rodada, filtro por grupo, card clicável) ---- */
function renderJogos(){
  const groups=groupsAvailable();
  const gchips=[`<button class="chip" data-g="ALL" aria-pressed="${GROUP_FILTER==='ALL'}">Todos os grupos</button>`]
    .concat(groups.map(g=>`<button class="chip" data-g="${g}" aria-pressed="${GROUP_FILTER===g}">Grupo ${g}</button>`)).join("");
  const list=MATCHES.filter(m=>GROUP_FILTER==="ALL"||m.group===GROUP_FILTER);
  let html=`<div class="filters">${gchips}</div>`;
  if(!list.length) html+=`<div class="empty">Sem jogos neste filtro.</div>`;
  else for(const r of roundsAvailable()){
    const inR=list.filter(m=>m.round===r);
    if(!inR.length) continue;
    html+=`<div class="roundhead">Rodada ${r}</div>`+inR.map(matchCard).join("");
  }
  $("#content").innerHTML=html;
  $$(".chip").forEach(c=>c.onclick=()=>{ GROUP_FILTER=c.dataset.g; renderJogos(); });
  $$(".match").forEach(el=>el.onclick=()=>openMatch(el.dataset.id));
}
function matchCard(m){
  const fin=m.status==="FINISHED"&&m.homeScore!=null;
  const nPicks=PROFILES.filter(p=>p.picks?.[m.id]?.home!=null).length;
  return `<div class="match" data-id="${esc(m.id)}">
    <div class="top"><span class="g">Grupo ${esc(m.group)} · Rodada ${m.round}</span>${statusBadge(m)}</div>
    <div class="scoreline">
      <div class="team home"><img src="${esc(m.homeCrest||'')}" alt="" onerror="this.style.visibility='hidden'"><span class="tn">${esc(m.home)}</span></div>
      <div style="display:flex;align-items:center;gap:8px"><span class="bignum">${fin?m.homeScore:"–"}</span><span class="vs">×</span><span class="bignum">${fin?m.awayScore:"–"}</span></div>
      <div class="team away"><span class="tn">${esc(m.away)}</span><img src="${esc(m.awayCrest||'')}" alt="" onerror="this.style.visibility='hidden'"></div>
    </div>
    ${fin?"":`<div class="kickoff">${esc(kickoff(m))}</div>`}
    <div class="cardfoot"><span>${nPicks} palpite${nPicks===1?"":"s"}</span><span class="go">ver palpites →</span></div>
  </div>`;
}

/* ---- Detalhe do jogo (modal): times + palpites de todos, ordenado por quem acertou melhor ---- */
function openMatch(id){
  const m=MATCHES.find(x=>x.id===id); if(!m) return;
  const fin=m.status==="FINISHED"&&m.homeScore!=null;
  let rows=PROFILES.map(p=>{
    const pk=p.picks?.[m.id]; const sc=scorePick(pk,m);
    return {p,pk,sc,has:!!(pk&&pk.home!=null)};
  });
  if(fin) rows.sort((a,b)=> (b.sc??-1)-(a.sc??-1) || a.p.name.localeCompare(b.p.name,"pt"));
  else rows.sort((a,b)=> (b.has-a.has) || a.p.name.localeCompare(b.p.name,"pt"));
  const list=rows.map((r,i)=>{
    const scoreTxt=r.has?`${r.pk.home}–${r.pk.away}`:"—";
    const tag = r.sc===null?`<span class="ptag pending">··</span>`:`<span class="ptag ${tagClass(r.sc)}">${fmtPts(r.sc)}</span>`;
    const mine=me()&&me().id===r.p.id;
    return `<div class="pick-line${mine?' me':''}">
      <div class="pl-who">${fin?`<span class="pl-rank">${i+1}</span>`:""}${avatar(r.p)}<span class="nm">${esc(r.p.name)}${mine?'<span class="youtag">você</span>':''}</span></div>
      <div class="pl-right"><span class="pscore${r.has?'':' none'}">${scoreTxt}</span>${tag}</div></div>`;
  }).join("") || `<div class="empty">Sem palpites ainda.</div>`;
  $("#modal").innerHTML=`<button class="x" id="m-x">×</button>
    <span class="status ${fin?'fin':(m.status==='IN_PLAY'?'live':'')}" style="display:inline-block;margin-bottom:8px">${fin?'Encerrado':(m.status==='IN_PLAY'?'● Ao vivo':'A jogar')} · Grupo ${esc(m.group)} · Rodada ${m.round}</span>
    <div class="modal-score">
      <div class="team home"><img src="${esc(m.homeCrest||'')}" alt="" onerror="this.style.visibility='hidden'"><span class="tn">${esc(m.home)}</span></div>
      <div style="display:flex;align-items:center;gap:8px"><span class="bignum">${fin?m.homeScore:"–"}</span><span class="vs">×</span><span class="bignum">${fin?m.awayScore:"–"}</span></div>
      <div class="team away"><span class="tn">${esc(m.away)}</span><img src="${esc(m.awayCrest||'')}" alt="" onerror="this.style.visibility='hidden'"></div>
    </div>
    ${fin?'<p class="locked-note" style="margin-bottom:8px">Ordenado por quem acertou melhor.</p>':`<p class="locked-note" style="margin-bottom:8px">${esc(kickoff(m))}</p>`}
    ${list}`;
  openModal(); $("#m-x").onclick=()=>closeModal();
}

/* ---- Palpiteiros (lista clicável) ---- */
function renderPerfis(){
  if(!PROFILES.length){ $("#content").innerHTML=`<div class="empty">Nenhum palpiteiro cadastrado.</div>`; return; }
  const cards=PROFILES.map(p=>{
    const s=statsFor(p,"ALL"); const mine=me()&&me().id===p.id;
    return `<div class="pcard${mine?' me':''}" data-id="${esc(p.id)}">${avatar(p)}
      <div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="tt">${fmtPts(s.total)} pts · ${s.played} jogos</div></div></div>`;
  }).join("");
  $("#content").innerHTML=`<div class="pgrid">${cards}</div>`;
  $$(".pcard").forEach(el=>el.onclick=()=>openProfile(el.dataset.id));
}

/* ---- Detalhe de um palpiteiro (modal read-only): palpites em todos os jogos ---- */
function openProfile(id){
  const p=profileById(id); if(!p) return;
  const s=statsFor(p,"ALL");
  const list=MATCHES.map(m=>{
    const pk=p.picks?.[m.id]; const sc=scorePick(pk,m); const has=!!(pk&&pk.home!=null);
    const fin=m.status==="FINISHED"&&m.homeScore!=null;
    const tag=sc===null?`<span class="ptag pending">··</span>`:`<span class="ptag ${tagClass(sc)}">${fmtPts(sc)}</span>`;
    return `<div class="pick-line">
      <div class="pl-who"><span class="tn" style="font-size:13px">${esc(m.home)} <span class="vs">×</span> ${esc(m.away)}</span></div>
      <div class="pl-right">
        <span class="pscore${has?'':' none'}">${has?`${pk.home}–${pk.away}`:"—"}</span>
        ${fin?`<span class="pscore" style="color:var(--muted)">(${m.homeScore}–${m.awayScore})</span>`:""}
        ${tag}</div></div>`;
  }).join("");
  $("#modal").innerHTML=`<button class="x" id="m-x">×</button>
    <div class="mhead">${avatar(p)}<div><h3 style="padding:0">${esc(p.name)}</h3>
      <div class="tt mono" style="color:var(--signal);font-size:13px">${fmtPts(s.total)} pts · ${s.c5}×5 · ${s.c3}×3 · ${s.c25}×2,5</div></div></div>
    ${p.bio?`<p class="locked-note" style="margin:6px 0 10px">${esc(p.bio)}</p>`:""}
    <div style="margin-top:10px">${list}</div>`;
  openModal(); $("#m-x").onclick=()=>closeModal();
}

/* ---- Meus palpites (próprio usuário): ver e editar ---- */
function renderMeus(){
  const p=me(); if(!p){ VIEW="ranking"; buildTabs(); render(); return; }
  const s=statsFor(p,"ALL");
  const list=MATCHES.map(m=>{
    const pk=p.picks?.[m.id]; const sc=scorePick(pk,m); const has=!!(pk&&pk.home!=null);
    const fin=m.status==="FINISHED"&&m.homeScore!=null;
    const tag=sc===null?`<span class="ptag pending">··</span>`:`<span class="ptag ${tagClass(sc)}">${fmtPts(sc)}</span>`;
    return `<div class="pick-line">
      <div class="pl-who"><span class="tn" style="font-size:13px">${esc(m.home)} <span class="vs">×</span> ${esc(m.away)}</span>
        <span class="status" style="font-size:9px">${fin?m.homeScore+"–"+m.awayScore:"R"+m.round}</span></div>
      <div class="pl-right"><span class="pscore${has?'':' none'}">${has?`${pk.home}–${pk.away}`:"—"}</span>${tag}</div></div>`;
  }).join("");
  $("#content").innerHTML=`
    <div class="board" style="margin-bottom:14px"><div class="row">
      <div class="rank" style="font-size:20px">★</div>
      <div class="who">${avatar(p)}<div><div class="nm">${esc(p.name)} <span class="youtag">você</span></div>
        <div class="meta">${s.c5}×5 · ${s.c3}×3 · ${s.c25}×2,5 · ${s.played} jogos</div></div></div>
      <div class="pts">${fmtPts(s.total)}<small>pontos</small></div></div></div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn primary small" id="editMineBtn">Editar meus palpites</button></div>
    ${list}`;
  $("#editMineBtn").onclick=()=>openPickEditor();
}
function openPickEditor(){
  const p=me(); if(!p) return;
  const rows=MATCHES.map(m=>{
    const pk=p.picks?.[m.id]||{}; const locked=m.status!=="TIMED"; // não dá pra editar jogo iniciado/encerrado
    return `<div class="pe-row" data-mid="${esc(m.id)}">
      <span class="lbl">${esc(m.home)}</span>
      <div class="mid">
        <input class="fld scoreinput ph" type="number" min="0" inputmode="numeric" value="${pk.home??""}" placeholder="–" ${locked?"disabled":""}>
        <span class="vs">×</span>
        <input class="fld scoreinput pa" type="number" min="0" inputmode="numeric" value="${pk.away??""}" placeholder="–" ${locked?"disabled":""}>
      </div>
      <span class="lbl away">${esc(m.away)}</span></div>`;
  }).join("");
  $("#modal").innerHTML=`<button class="x" id="m-x">×</button>
    <h3>Palpites de ${esc(p.name)}</h3>
    <p class="locked-note" style="margin:4px 0 6px">Só dá pra editar jogos que ainda não começaram.</p>
    ${rows}
    <div class="modal-actions"><button class="btn ghost" id="m-cancel">Cancelar</button><button class="btn primary" id="m-ok">Salvar</button></div>`;
  openModal();
  $("#m-x").onclick=()=>closeModal(); $("#m-cancel").onclick=()=>closeModal();
  $("#m-ok").onclick=()=>{
    const picks={...(p.picks||{})};
    $$(".pe-row").forEach(row=>{
      const mid=row.dataset.mid, h=$(".ph",row).value, a=$(".pa",row).value;
      if($(".ph",row).disabled) return; // mantém o que já estava
      if(h!==""&&a!=="") picks[mid]={home:+h,away:+a}; else delete picks[mid];
    });
    p.picks=picks; PROFILES=PROFILES.map(x=>x.id===p.id?p:x);
    DIRTY=true; closeModal(); render(); save();
  };
}

/* ============================================================ MODAL */
function openModal(){ $("#scrim").classList.add("open"); }
function closeModal(fromEntry){ if(ENTRY_LOCK&&!fromEntry) return; ENTRY_LOCK=false; $("#scrim").classList.remove("open"); $("#modal").innerHTML=""; }
$("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") closeModal(); });

/* ============================================================ EVENTOS */
$("#switchBtn").onclick=()=>openEntry(false);
window.addEventListener("beforeunload",e=>{ if(DIRTY){ e.preventDefault(); e.returnValue=""; }});
setInterval(()=>{ if(!DIRTY) loadMatches().then(()=>{ if($("#scrim").classList.contains("open")) return; render(); }).catch(()=>{}); }, 5*60*1000);

loadAll();
</script>
</body>
</html>
